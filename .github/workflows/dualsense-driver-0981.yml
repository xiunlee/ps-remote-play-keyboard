name: Isolated DualSense on usbip-win2 0.9.8.1

on:
  push:
    branches: [codex/commercial-preview]
    paths:
      - '.github/workflows/dualsense-driver-0981.yml'
      - 'research/dualsense-driver-test/**.ps1'
      - 'research/dualsense-driver-test/**.cs'
      - 'research/dualsense-driver-test/labserver/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-dualsense-driver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  driver-readback:
    # Standard public-repository runner; no larger runner, cache, or artifact upload.
    # This guest never connects to the user's computer or Sony account.
    if: github.repository == 'xiunlee/ps-remote-play-keyboard' && github.ref == 'refs/heads/codex/commercial-preview'
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        persona:
          - dualsensecombinedaudioduplexv5
          - dualsensegamepadv5
          - dualsenseedgecombinedaudioduplexv5
          - dualsenseedgegamepadv5
    steps:
      - name: Check out the research commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and test in this disposable Windows guest
        shell: pwsh
        env:
          TEST_PERSONA: ${{ matrix.persona }}
        run: |
          $testOutput = Join-Path $env:RUNNER_TEMP ('dualsense-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-' + $env:TEST_PERSONA)
          ./research/dualsense-driver-test/Run-HostedDriverTest.ps1 -IsolatedDriverTestOnly -Persona $env:TEST_PERSONA -OutputDirectory $testOutput
